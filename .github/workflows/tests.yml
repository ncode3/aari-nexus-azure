name: Nexus tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Verify Azure async credential transport
        run: python -c "from azure.core.pipeline.transport import AioHttpTransport; AioHttpTransport()"
      - run: python -m compileall -q app infra
      - run: python -m unittest discover -s tests -v
