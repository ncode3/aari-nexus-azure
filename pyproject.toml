[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aari-data-platform"
version = "0.1.0"
description = "Portable data platform for the Atlanta AI & Robotics Initiative"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.2,<2",
  "minio>=7.2,<8",
  "openpyxl>=3.1,<4",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "python-multipart>=0.0.18,<1",
  "sqlalchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "testcontainers[minio,postgres]>=4.9,<5",
  "types-python-dateutil>=2.9,<3",
  "types-openpyxl>=3.1,<4",
]
redis = ["redis>=5.2,<6"]
legacy = [
  "azure-identity>=1.19,<2",
  "azure-keyvault-secrets>=4.9,<5",
  "azure-monitor-opentelemetry>=1.6,<2",
  "azure-storage-blob>=12.23,<13",
  "openai>=1.54,<2",
  "python-docx>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires disposable PostgreSQL and MinIO containers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"app/agents.py" = ["I001"]
"app/arbiter.py" = ["I001"]
"app/assessment_flow.py" = ["I001"]
"app/bot.py" = ["I001"]
"app/commands.py" = ["I001"]
"app/config.py" = ["I001"]
"app/evidence_analytics.py" = ["I001"]
"app/telemetry.py" = ["S110"]
"scripts/regenerate_evidence_analytics.py" = ["S110"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["migrations", "app/agents.py", "app/arbiter.py", "app/bot.py", "app/commands.py"]
